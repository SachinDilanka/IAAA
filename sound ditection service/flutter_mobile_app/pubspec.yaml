name: sound_alert_system
description: "Offline Real-Time Environmental Sound & Sinhala Emergency Keyword Awareness System for Deaf Individuals with Yesido IO39 Smartwatch Alert Delivery."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.0.0
  provider: ^6.1.1
  google_fonts: ^6.1.0
  intl: ^0.19.0
  fl_chart: ^0.66.2
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.2
  flutter_blue_plus: ^1.31.0
  speech_to_text: ^7.4.0
  audio_streamer: ^5.0.0
  vibration: ^3.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/models/
    - assets/fonts/

  fonts:
    - family: NotoSansSinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala-Regular.ttf
        - asset: assets/fonts/NotoSansSinhala-Bold.ttf
          weight: 700

