<!DOCTYPE html>
<html lang="en" data-theme="high-contrast">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Displaying Message - AssistComm</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design_system.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <style>
        body {
            background-color: #000000 !important;
            color: #ffffff !important;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .billboard-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            padding: 1.5rem;
            box-sizing: border-box;
        }

        .billboard-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .billboard-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            padding: 2.5rem 2rem;
            background: #121212;
            border: 4px solid #ffee00;
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(255, 238, 0, 0.25);
            transition: transform 0.4s ease;
        }

        .billboard-card.rotated {
            transform: rotate(180deg);
        }

        .billboard-icon {
            font-size: 4rem;
            color: #ffee00;
            margin-bottom: 1.5rem;
        }

        .billboard-text {
            font-family: 'Outfit', 'Inter', sans-serif;
            font-size: clamp(2.5rem, 6vw, 5.5rem);
            font-weight: 900;
            line-height: 1.25;
            color: #ffffff;
            letter-spacing: -0.02em;
            word-break: break-word;
        }

        .flip-btn-active {
            background-color: #ffee00 !important;
            color: #000000 !important;
            font-weight: bold;
        }

        .nav-back-billboard {
            font-size: 1.25rem;
            padding: 0.85rem 1.5rem;
        }
    </style>
</head>
<body>
    <div class="billboard-container">
        <!-- Control Toolbar -->
        <header class="billboard-toolbar">
            <a href="{% if location_slug and location_slug != 'other' %}{{ url_for('views.location_dashboard', slug=location_slug) }}{% else %}{{ url_for('views.index') }}{% endif %}" class="btn btn-outline nav-back-billboard" aria-label="Back to messages">
                <i class="fa-solid fa-arrow-left"></i> Back
            </a>

            <div class="header-controls">
                <button id="flip-text-btn" class="btn btn-accent" aria-label="Flip text 180 degrees for person across table">
                    <i class="fa-solid fa-rotate"></i> Flip View (180°)
                </button>
            </div>
        </header>

        <!-- Fullscreen Message Display Card -->
        <main id="billboard-card" class="billboard-card">
            <div class="billboard-icon">
                <i class="fa-solid {{ icon }}"></i>
            </div>
            <div class="billboard-text" id="billboard-text-content">
                {{ message_text }}
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const flipBtn = document.getElementById('flip-text-btn');
            const card = document.getElementById('billboard-card');

            flipBtn.addEventListener('click', () => {
                card.classList.toggle('rotated');
                flipBtn.classList.toggle('flip-btn-active');
            });
        });
    </script>
</body>
</html>
