<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>{% block title %}AssistComm - Accessible Communication Assistant{% endblock %}</title>
    
    <!-- FontAwesome icons for accessible visual cues -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts for high-legibility typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header class="app-header">
        <div class="header-container">
            <a href="{{ url_for('main.index') }}" class="brand-logo" aria-label="AssistComm Home Page">
                <i class="fa-solid fa-hands-asl-interpreting brand-icon"></i>
                <span class="brand-title">AssistComm</span>
            </a>
        </div>
    </header>

    <main id="main-content" class="main-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <p><i class="fa-solid fa-universal-access"></i> Accessible Communication Assistant • Designed for Deaf & Non-Verbal Users</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
