name: adaptive_sign_language_tutor
description: "A new Adaptive Sign Language Tutor Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # UI & Styling
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Local Storage & Database (SQLite)
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Hardware & Camera Processing
  camera: ^0.12.1
  permission_handler: ^11.3.1

  # Analytics & Performance Charts
  fl_chart: ^0.68.0
  hand_landmarker: ^3.1.0
  model_viewer_plus: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
